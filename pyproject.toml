[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicodebrailleinput"
dynamic = ["version"]
description = "Displays a text field to type numeric braille (e.g. 1345-1236-145-1) and converts it into unicode braille characters."
maintainers = [
	{name = "Mesar Hameed", email = "mhameed@src.gnome.org"},
	{name = "Patrick Zajda", email = "patrick@zajda.fr"},
	{name = "Leonard de Ruijter", email = "alderuijter@gmail.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.txt"}
dependencies = [
	"scons==4.10.1",
	"Markdown==3.10",
	"requests==2.33.0",
	"nh3==0.3.2",
	"crowdin-api-client==1.24.1",
	"lxml==6.1.0",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
	"uv==0.11.6",
	"ruff==0.14.5",
	"pre-commit==4.2.0",
]

[project.urls]
Repository = "https://github.com/leonardder/unicodeBrailleInput"
Issues = "https://github.com/leonardder/unicodeBrailleInput/issues"

[tool.ruff]
line-length = 110
builtins = [
	"_",
	"ngettext",
	"pgettext",
	"npgettext",
]
include = [
	"*.py",
	"sconstruct",
]
exclude = [
	".git",
	"__pycache__",
	".venv",
	"buildVars.py",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	"W191",
]
logger-objects = ["logHandler.log"]
select = [
	"A",
	"ARG",
	"B",
	"C90",
	"E",
	"F",
	"FIX",
	"I",
	"INT",
	"PERF",
	"RUF",
	"UP",
	"W",
]

[tool.ruff.lint.per-file-ignores]
"sconstruct" = ["F821"]
